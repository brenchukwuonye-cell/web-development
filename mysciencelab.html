<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My science lab</title>
    <style>
        body {background-color: antiquewhite; font-family: Arial, sans-serif;}
        .jumbotron{background-color: bisque; border-left: 6px solid;
        }
      .jumbotron h1 {color:aqua}
      .section-title{color:burlywood; margin-top: 30px; margin-bottom: 15px;
     }
     p{font-weight: bold; margin-bottom: 5px;}
    </style>
</head>
<body>
 <div class="jumbotron jumbo-tron fluid">
 <div class="container">
    <h1>My science Lab</h1>
    <p class="lead">Welcome to the lab. Here we experiment and research projects</p>

    <button class="btn btn-primary">chemistry</button>
    <button class="btn btn-success">Biology</button>
    <button class="btn btn-warning">physics</button>
    <button class="btn btn-danger">astronomy</button>
 </div>
</div>

<div class="container">

 <h2 class="section-title">Experiments completed <span class="badge badge-danger">4</span></h2>
 <p>chemistry <span class="badge badge-primary">7 experiments</span></p>
 <p>astronmy<span class="badge badge-success">5 experiments</span></p>
 <p>physics <span class="badge badge-warning">3 experiments</span></p>
 <p>biology <span class="badge badge-info">4 experiments</span></p>

 <h2 class="section-title">research progress</h2>
  <P>chemistry</P>
  <div class="progress mb-3">
    <div class="progress-bar bg-primary" style="width: 85%">85%</div>
    </div>
    
    <P>biology</P>
  <div class="progress mb-3">
    <div class="progress-bar bg-success" style="width: 70%">70%</div>
    </div>

    <P>chemistry</P>
  <div class="progress mb-3">
    <div class="progress-bar bg-warning" style="width: 55%">55%</div>
   </div>

    <P>astronomy</P>
  <div class="progress mb-3">
    <div class="progress-bar bg-danger" style="width: 40%">40%</div>
    </div>
</div>
</body>
</html>
