<!DOCTYPE html>
<html>
<head>
  <title>Event Registration Form</title>
 
  <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #F8FAFC; 
    color: #0F172A; 
    text-align: center;
}

.form-card {
    width: 520px;
    background-color: white;
    border: 3px solid #2563EB; 
    border-radius: 18px;
    margin: 40px auto;
    padding: 25px;
    box-shadow: 0 0 18px rgba(15, 23, 42, 0.1); 
}

h1 {
    color: #0F172A; 
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin-top: 12px;
    color: #334155; 
}

input,
select {
    width: 95%;
    padding: 10px;
    margin-top: 6px;
    border: 2px solid #CBD5E1; 
    border-radius: 8px;
    font-size: 15px;
    background-color: #F8FAFC; 
    color: #0F172A;
}

button {
    background-color: #0F172A; 
    color: white;
    border: none;
    border-radius: 25px;
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s ease; /
}

button:hover {
    background-color: #2563EB; 
}

button:hover {
    background-color: #2563EB; 
}

#feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    line-height: 1.6;
    border: 2px solid #059669; 
}

.success {
    background-color: #ECFDF5; 
    color: #065F46; 
}

  </style>
</head>
 
<body>
 
  <div class="form-card">
 
    <h1>Event Registration Form</h1>
 
    <p>
      Fill in the form to register for the school event and generate your event pass.
    </p>
 
    <form id="eventForm">
 
      <label for="studentName">Student Name</label>
      <input
        type="text"
        id="studentName"
        required
        minlength="3"
        placeholder="Enter your name"
      >
 
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        required
        placeholder="Enter your email"
      >
 
      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        required
        min="8"
        max="18"
        placeholder="Enter your age"
      >
 
      <label for="eventName">Choose Event</label>
      <select id="eventName" required>
        <option value="">Select an event</option>
        <option value="Robotics Exhibition">Robotics Exhibition</option>
        <option value="Creative Writing Competition">Creative Writing Competiton</option>
        <option value="Drama Performace">Drama Performance</option>
        <option value="Math Olympiad">Math Olympiad</option>
      </select>
 
      <button type="button" onclick="registerEvent()">Register Now</button>
 
    </form>
 
    <div id="feedback">
      Waiting for registration...
    </div>
 
  </div>
 
  <script>
    function registerEvent() {
 
      let form = document.getElementById("eventForm");
      let feedback = document.getElementById("feedback");
 
      try {
 
        if (!form.checkValidity()) {
          throw form.reportValidity();
        }
 
        let studentName = document.getElementById("studentName").value;
        let email = document.getElementById("email").value;
        let age = Number(document.getElementById("age").value);
        let eventName = document.getElementById("eventName").value;
 
        if (studentName.length < 3) {
          throw "Name must have at least 3 characters.";
        }
 
        if (age < 8 || age > 18) {
          throw "Age must be between 8 and 18.";
        }
 
        if (eventName === "") {
          throw "Please select an event.";
        }
 
        feedback.className = "";
        feedback.innerHTML = "Checking your registration details...";
 
        setTimeout(function() {
          let passNumber = Math.floor(Math.random() * 9000) + 1000;
 
          feedback.className = "success";
          feedback.innerHTML =
            "Registration Successful!<br>" +
            "Student Name: " + studentName + "<br>" +
            "Email: " + email + "<br>" +
            "Age: " + age + "<br>" +
            "Event: " + eventName + "<br>" +
            "Your Event Pass Number: EVT-" + passNumber;
        }, 2000);
 
      } catch (error) {
 
        feedback.className = "error";
 
        if (error !== undefined) {
          feedback.innerHTML = "Registration failed: " + error;
        } else {
          feedback.innerHTML = "Please complete all required fields correctly.";
        }
      }
    }
  </script>
 
</body>
</html>
