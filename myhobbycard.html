<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>My Hobby card</title>
    <style>
    Body {
     background-color: antiquewhite;
     font-family: Arial,sans-serif;
     padding: 30px 15px;
    }
    h1{
     text-align: center;
     color:cadetblue;
    }
    .hobby-card{
        text-align: center;
        border: 2px solid;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        background-color: burlywood;
    }
    .hobby-card h3{
        color: black;
    }
    </style>
</head>
<body>
 
  <h1>My Hobby Card</h1>

  <div class="container">

    <div class="row">
    
    <div class="col-12 col-md-6 col-lg-4">

    <div class="hobby-card">
     <h3>Drawing</h3>
     <p>I love sketching animals and comics</p>
      </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">

      <div class="hobby-card">
     <h3>Basketball</h3>
     <p>I love playing basketball with my friends</p>
      </div>
      </div>
      <div class="col-12 col-md-12 col-lg-4">


      <div class="hobby-card">
     <h3>Playing games</h3>
     <p>I love playing my favourite games on my ps5</p>
      </div>
      </div>
</body>
</html>
