<!DOCTYPE html>
<html>
  <head>
    <title>Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .topnav {
        overflow: hidden;
        background-color:bisque;
      }
      .topnav a {
        float: left;
        color:cadetblue;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }
      .topnav a:hover {
        background-color:darkcyan;
        color: black;
      }
      .topnav a.active {
        background-color:darkkhaki;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="http://127.0.0.1:5500/navbar/aboutus2.html">About_Us</a>
      <a href="http://127.0.0.1:5500/navbar/gallery.html">Gallery</a>
      <a href="http://127.0.0.1:5500/navbar/services.html">Services</a>
      <a href="http://127.0.0.1:5500/navbar/offer.html">Offer</a>
      <a href="http://127.0.0.1:5500/navbar/contact.html">Contact_Us</a>
    </div>
  </body>
</html>
