<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Kid</title>
    <style>

   /* Typography- font, size, weight, colour for the whole page
    */
    body{
        background-color: darkblue;
        color:white;
        font-family:Ariel,sans-serif;
    }
     
    .hero-name{
     font-size: 60px;
     font-weight: bold;
     color: yellow;
     text-shadow: 3px 3px 3px rgb(255, 132, 0) 
    }

    .tagline{
     font-style:italic;
     color:blue;
     text-transform: capitalize;
    }
     
    /* Text transform + text decoration - section headings in CAPS with underline */
    .label {
     text-transform: uppercase;
     text-decoration: underline;
     color:coral
    }

    /* typography-power stands out in bold green */
     .power{
     font-weight: bold;
     color:green;
    }

    .badge {
     font-size:28px;
     font-weight:bold;
     transform: rotate(15deg);
     color:gold;
    }
    </style>
</head>
<body>
   <h1 class="hero-name">Thunder Kid</h1><br>
   <p class="label">The most powerful hero in school</p><br>
    
   <h2 class="label">superpowers</h2><br>
   <P class="power">can run faster than cheetah</P><br>
   <p class="power">can lift a school bus</p><br>

   <h2 class="label">weaknesses</h2><br>
   <P class="weakness">broccoli</P><br>
   <p class="weakness">maths homework</p><br>

   <p class="badge">Top hero</p><br>

   <p class="made by"> created by Brendan</p>

</body>
</html>
