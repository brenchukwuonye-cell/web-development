<section>
  <img class="mySlides" src="images (4).jpg" style="height:500px; width:1340px;">
  <img class="mySlides" src="images (5).jpg" style="height:500px; width:1340px;">
  <img class="mySlides" src="images (6).jpg" style="height:500px; width:1340px;">
</section>

<script>
var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}
  x[myIndex-1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>
