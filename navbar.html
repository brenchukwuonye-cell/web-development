<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
     body {
     margin: 0;
     font-family: Arial, sans-serif;
     }

     .topnav {
        overflow: hidden;
        background-color: cornflowerblue;
     }

     .topnav a {
     float:left;
     color:aquamarine;
     text-align: center;
     padding: 14px 16px;
     text-decoration: none;
     font-size: 17px;
     }

     .topnav a:hover {
     background-color:cadetblue;
     color: darkslateblue;
     }

     .topnav a.active {
     background-color: deepskyblue;
     color: aqua;
     }
    </style>
</head>
<body>
 <div class="topnav">
 <a class="active" href="#home">Home</a>
 <a href="http://127.0.0.1:5500/navbar/aboutus.html">About_Us</a>
 <a href="http://127.0.0.1:5500/navbar/gallery.html">Gallery</a>
 <a href="http://127.0.0.1:5500/navbar/contact.html">Contact_Us</a>
 </div>
</body>
</html>
