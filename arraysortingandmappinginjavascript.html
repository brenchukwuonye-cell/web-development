<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist Sorter</title>
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
     body{background: cadetblue;}
     h1, h3 {color: burlywood;}
     .box{background:darkcyan; color:deepskyblue}
    </style>
</head>
<body>
<div class="cotainer py-4">

 <h1 class="mb-1">My Playlist Sorter</h1>
 <p class="text-muted mb-4">Sort And Label your music playlist usingJavascript array methods!></p>

 <div class="card mb-4">
 <div class="card-body">
 <h3 class="card-title">Song Names</h3>
 <button class="btn btn-primary  mr-2"
  onclick="sortAZ()">Sort A to Z</button>
   <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
   <div id="nameResult" class="box p-3 mt-3 rounded"></div>
 </div>
</div>

<div class="card mb-4">
 <div class="card-body">
 <h3 class="card-title">Play Counts</h3>
 <button class="btn btn-primary  mr-2"
  onclick="sortleast()">Least Played First</button>
   <button class="btn btn-primary" onclick="sortmost()">Most Played First</button>
   <div id="countResult" class="box p-3 mt-3 rounded"></div>
 </div>
</div>

<div class="card mb-4">
 <div class="card-body">
 <h3 class="card-title">Label Every Play Count</h3>
 <button class="btn btn-primary  mr-2"
  onclick="addLabel()">Add Plays Labels</button>
   <div id="labelResult" class="box p-3 mt-3 rounded"></div>
 </div>
</div>

<script>
 var songs = ["Zoom", "Bounce", "Glow", "Rush", "Spark"];
 var plays = [320, 85, 210, 50, 175];

 document.getElementById("nameResult").innerHTML = "Songs: " + songs;
 document.getElementById("countResult").innerHTML = "Plays: " + plays;
 document.getElementById("labelResult").innerHTML = "Press the button above!";
</script>
</body>
</html>
